name: 3PP License Check

on:
  push:
    branches:
      - master
  workflow_dispatch:
  pull_request:
    branches:
      - master
  release:
    types:
      - published
  schedule:
    - cron: '0 4 * * *' # Runs every day at 4am: https://docs.github.com/en/actions/reference/events-that-trigger-workflows#scheduled-events-schedule

jobs:

  License-check:
    name: 3PP License Check using dash-licenses (${{ matrix.os }})

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [20]
        java: [11]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need full history so we can diff yarn.lock against the PR base /
          # previous push to scope the scan to just the changed dependencies.
          fetch-depth: 0

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Use Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}

      # Decide whether to run a full scan of yarn.lock or scan only the
      # coordinates added since the base ref.
      #
      #   full     releases and pushes to master (and anything else, such as
      #            scheduled / manual runs, which have no PR base to diff
      #            against) -- vetted against the entire dependency graph.
      #   changed  any pull request (human or Dependabot) -- scan only the
      #            coordinates added to yarn.lock vs the PR base. A PR that
      #            adds no new dependencies has nothing to scan.
      - name: Determine scan scope
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mode="full"
          base_ref=""

          if [ "$EVENT_NAME" = "pull_request" ]; then
            # Pull requests (human or Dependabot) are scanned on the delta:
            # only the coordinates added to yarn.lock since the PR base.
            mode="changed"
            base_ref="$PR_BASE_SHA"
          else
            # Releases, pushes to master, scheduled and manual runs are vetted
            # against the full dependency graph.
            echo "Event '$EVENT_NAME' uses a full license scan."
          fi

          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "base_ref=$base_ref" >> "$GITHUB_OUTPUT"
          echo "Selected license-check mode: $mode"

      - name: Run dash-licenses
        shell: bash
        run: |
          yarn --frozen-lockfile --ignore-scripts
          scripts/license-check.sh "${{ steps.scope.outputs.mode }}" "${{ steps.scope.outputs.base_ref }}"
        env:
          DASH_TOKEN: ${{ secrets.DASH_LICENSES_PAT }}
