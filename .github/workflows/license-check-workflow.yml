name: 3PP License Check

on:
  push:
    branches:
      - master
  workflow_dispatch:
  pull_request:
    branches:
      - master
  schedule:
    - cron: '0 4 * * *' # Runs every day at 4am: https://docs.github.com/en/actions/reference/events-that-trigger-workflows#scheduled-events-schedule

jobs:

  License-check:
    name: 3PP License Check using dash-licenses (${{ matrix.os }})

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [20]
        java: [11]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need full history so we can diff yarn.lock against the PR base /
          # previous push to scope the scan to just the changed dependencies.
          fetch-depth: 0

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Use Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}

      # Decide whether to run a full scan of yarn.lock or scan only the
      # coordinates added since the base ref. We scope to the changed
      # dependencies ONLY for Dependabot version-bump PRs that touch nothing
      # but yarn.lock. Every other trigger (manual, scheduled, pushes to
      # master, human PRs) gets a full scan.
      - name: Determine scan scope
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_ACTOR: ${{ github.actor }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mode="full"
          base_ref=""

          if [ "$EVENT_NAME" = "pull_request" ] && [ "$PR_ACTOR" = "dependabot[bot]" ]; then
            base_ref="$PR_BASE_SHA"
            # Only scope to changed coordinates when the PR changes nothing but
            # yarn.lock; otherwise fall back to a full scan to be safe.
            changed_files="$(git diff --name-only "$base_ref"...HEAD)"
            echo "Files changed vs base:"
            echo "$changed_files"
            if [ "$changed_files" = "yarn.lock" ]; then
              mode="changed"
            else
              echo "Dependabot PR changes more than yarn.lock; using full scan."
            fi
          fi

          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "base_ref=$base_ref" >> "$GITHUB_OUTPUT"
          echo "Selected license-check mode: $mode"

      - name: Run dash-licenses
        shell: bash
        run: |
          yarn --frozen-lockfile --ignore-scripts
          scripts/license-check.sh "${{ steps.scope.outputs.mode }}" "${{ steps.scope.outputs.base_ref }}"
        env:
          DASH_TOKEN: ${{ secrets.DASH_LICENSES_PAT }}
